name: Verify an existing HKsLGT installer

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: HKsLGT build run with a test installer
        required: true
        type: string
      version:
        description: Beta version to verify
        required: true
        type: string
      install_scope:
        description: Installation scope for the candidate
        type: choice
        default: currentuser
        options: [currentuser, allusers]
      user_to_machine:
        description: Upgrade a per-user baseline to a machine-wide installation
        type: boolean
        default: false
      predecessor_run:
        description: Optional earlier installer build for this upgrade test
        type: string
      predecessor_sha256:
        description: Required pinned installer SHA-256 when using an earlier build
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      SOURCE_RUN: ${{ inputs.run_id }}
      LEAGUE_VERSION: ${{ inputs.version }}
      INSTALL_SCOPE: ${{ inputs.install_scope }}
      USER_TO_MACHINE: ${{ inputs.user_to_machine }}
      PREDECESSOR_RUN: ${{ inputs.predecessor_run }}
      PREDECESSOR_SHA256: ${{ inputs.predecessor_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: HKsLGT-${{ inputs.version }}-windows-x64
          path: ${{ runner.temp }}/hkslgt-candidate
      - name: Verify the exact built package over the released version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_RUN -cnotmatch '^[1-9][0-9]*$' -or $env:LEAGUE_VERSION -cnotmatch '^\d+\.\d+\.\d+-beta\.\d+$') { throw 'Expected a numeric build run and a Beta version.' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $endpoint = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN"
          $build = Invoke-RestMethod -Uri $endpoint -Headers $headers
          $jobs = Invoke-RestMethod -Uri "$endpoint/jobs" -Headers $headers
          $compiled = @($jobs.jobs | ForEach-Object steps | Where-Object {
            $_.name -ceq 'Run locked Rust tests and build the Windows x64 installer' -and $_.conclusion -eq 'success'
          })
          $sameCandidate = $env:GITHUB_REF_NAME -ceq 'codex/hkslgt-live-aram-panels' -and
            $build.head_branch -ceq $env:GITHUB_REF_NAME -and $build.head_sha -ceq $env:GITHUB_SHA -and
            $build.path -ceq '.github/workflows/verify-windows.yml' -and $build.conclusion -ceq 'success'
          if (($build.head_branch -cne 'main' -and !$sameCandidate) -or $compiled.Count -ne 1) { throw 'Expected a verified HKsLGT build.' }
          $directory = Join-Path $env:RUNNER_TEMP 'hkslgt-candidate'
          $proof = Get-Content -LiteralPath (Join-Path $directory 'provenance.json') -Raw | ConvertFrom-Json
          $name = "MaxGameStudioLeague_$($env:LEAGUE_VERSION)_x64-setup.exe"
          $installer = Join-Path $directory $name
          $sha = (Get-FileHash -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($proof.sourceCommit -cne $build.head_sha -or $proof.workflowRunId -ne $env:SOURCE_RUN -or
              $proof.version -cne $env:LEAGUE_VERSION -or $proof.installer -cne $name -or $proof.installerSha256 -cne $sha) {
            throw 'Candidate provenance or SHA-256 did not match the selected build.'
          }
          $baselineOptions = @{}
          if ($env:PREDECESSOR_RUN -or $env:PREDECESSOR_SHA256) {
            if ($env:PREDECESSOR_RUN -cnotmatch '^[1-9][0-9]*$' -or $env:PREDECESSOR_SHA256 -cnotmatch '^[a-f0-9]{64}$') { throw 'Supply an earlier run and its exact installer SHA-256 together.' }
            $dir = Join-Path $env:RUNNER_TEMP 'hkslgt-earlier-build'
            gh run download $env:PREDECESSOR_RUN --repo $env:GITHUB_REPOSITORY --pattern 'HKsLGT-*-windows-x64' --dir $dir
            if ($LASTEXITCODE) { throw 'Could not download the earlier installer.' }
            $prior = @(Get-ChildItem -LiteralPath $dir -Recurse -File -Filter '*_x64-setup.exe')
            if ($prior.Count -ne 1 -or (Get-FileHash -LiteralPath $prior[0].FullName).Hash -ine $env:PREDECESSOR_SHA256) { throw 'The earlier installer digest did not match.' }
            $baselineOptions = @{ BaselineRepository='HKsLGT'; BaselineInstaller=$prior[0].FullName; BaselineVersion=$prior[0].VersionInfo.ProductVersion; BaselineSha256=$env:PREDECESSOR_SHA256 }
          } elseif (Test-Path -LiteralPath './packaging/windows/beta-baseline.json') {
            $baseline = Get-Content -LiteralPath './packaging/windows/beta-baseline.json' -Raw | ConvertFrom-Json
            ./packaging/windows/prepare-beta-baseline.ps1 -Version $baseline.version -InstallerSha256 $baseline.installerSha256 -CatalogPath (Join-Path $env:RUNNER_TEMP 'hkslgt-predecessor-catalog.json')
            $baselineOptions = @{ BaselineRepository='HKsLGT'; BaselineVersion=$baseline.version; BaselineSha256=$baseline.installerSha256 }
          }
          ./packaging/windows/tests/verify-hkslgt-overlay.ps1 -Installer $installer -Version $env:LEAGUE_VERSION -ExecutableSha256 $proof.executableSha256 -InstallScope $env:INSTALL_SCOPE -UserToMachine:($env:USER_TO_MACHINE -eq 'true') @baselineOptions
